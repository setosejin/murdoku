<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover 가 있어야 env(safe-area-inset-*) 가 0 이 아닌 값을 준다 (노치 기기 하단바) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f1e3" />
    <title>murdoku 머도쿠 — 증언을 조합해 범인을 찾는 추리 퍼즐</title>
    <meta name="description" content="증언을 조합해 평면도 위 자리를 확정하고, 피해자와 같은 방에 있던 범인을 지목하는 추리 퍼즐." />

    <!-- 카카오톡·트위터 등 링크 미리보기. 스크래퍼는 JS 를 실행하지 않으므로 여기 정적으로 박아야 한다.
         og:image 는 절대 URL 이어야 하고(상대 경로는 해석 안 됨), 카카오는 PNG/JPG 만 읽는다 — SVG 금지.
         카카오 미리보기는 2:1 로 스마트 크롭하므로 og.png 는 1200×600 으로 맞춰 두었다.
         이미지를 바꾸면 ?v= 를 올리고 https://developers.kakao.com/tool/debugger/sharing 에서 캐시를 지울 것
         (카카오는 스크랩 결과를 몇 시간 캐싱한다). 커스텀 도메인이 생기면 이 URL 세 줄만 고치면 된다. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="murdoku" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:title" content="murdoku 머도쿠 — 증언을 조합해 범인을 찾는 추리 퍼즐" />
    <meta
      property="og:description"
      content="증언을 조합해 평면도 위 자리를 확정하고, 피해자와 같은 방에 있던 범인을 지목하는 추리 퍼즐."
    />
    <meta property="og:url" content="https://setosejin.github.io/murdoku/" />
    <meta property="og:image" content="https://setosejin.github.io/murdoku/og.png?v=1" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="600" />
    <meta property="og:image:alt" content="평면도 위에 용의자와 피해자가 놓인 머도쿠 사건 화면" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
