name = "murdoku-history"
main = "index.ts"
# 런타임이 지원하는 날짜여야 한다. 오늘 날짜를 넣으면 workerd 가
# "newest date supported is ..." 로 뜨면서 wrangler dev 가 안 뜬다
compatibility_date = "2026-07-29"

# 네임스페이스는 계정당 한 번만 만든다:
#   npx wrangler kv namespace create HISTORY
# id 는 계정 안의 자원 이름일 뿐 자격증명이 아니라 공개 저장소에 그대로 둔다
# (API 토큰 없이는 아무것도 못 한다).
[[kv_namespaces]]
binding = "HISTORY"
id = "ee115f0bb41047bbb7fe3290fe63808a"

# CORS 허용 오리진. 로컬 개발은 npx wrangler dev 로 별도 확인
[vars]
ORIGIN = "https://setosejin.github.io"

# 관리자 토큰은 vars 가 아니라 시크릿이다 (공개 저장소에 들어가면 안 된다):
#   npx wrangler secret put ADMIN_TOKEN     ← openssl rand -hex 32 로 만든 값
# 안 넣으면 /adm/* 가 전부 401 이다 — 관리 화면이 그냥 안 열린다.
# 로컬 확인은 npx wrangler dev --var ADMIN_TOKEN:아무거나
