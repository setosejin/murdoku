<!--
  가구·벽부착물 아이콘. 이 앱의 디자인 언어(두꺼운 잉크 선 + 플랫 색)로 직접 그렸다.
  선 색·굵기는 지정하지 않는다 — 쓰는 쪽(`svg.art`)에서 상속받아 한 곳에서 조절한다.
  id 는 `i-<FurnitureSpec.kind>` 규칙. 이름이 맞으면 자동으로 쓰이고, 없으면 이모지로 떨어진다.

  **viewBox 는 한 칸당 24 다.** `FurnitureSpec.size` 가 2 면 48×24, 3 이면 72×24,
  4(2×2)면 48×48. 늘려 쓰지 않으므로 선 굵기가 한 칸짜리 가구와 같다.
  칸 경계(x=24, 48…)에 부품 경계를 맞춰 그린다 — 세 칸짜리 소파는 2인용 소파 두 칸 +
  스툴 한 칸처럼, 칸마다 제 몫의 물건이 보이게. 크기를 바꾸면 여기도 다시 그려야 한다.
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display: none" aria-hidden="true">
  <!-- ▸ 2칸: 베개 한 칸 + 이불 한 칸 -->
  <symbol id="i-bed" viewBox="0 0 48 24">
    <path d="M3 18V7a2 2 0 0 1 2-2h38a2 2 0 0 1 2 2v11z" fill="#e7d7b4" />
    <rect x="5.5" y="7.5" width="16" height="7.5" rx="2" fill="#fffdf7" />
    <path d="M24 15V7.5h18.5a1 1 0 0 1 1 1V15z" fill="#c0392b" />
    <path d="M3 15h42v3H3z" fill="#e7d7b4" />
    <path d="M3 18v3M45 18v3" />
  </symbol>

  <!-- ▸ 3칸: 2인용 소파(방석 두 칸) + 스툴 한 칸 -->
  <symbol id="i-sofa" viewBox="0 0 72 24">
    <path d="M4 17v-7a3 3 0 0 1 3-3h32a3 3 0 0 1 3 3v7z" fill="#9b7e9e" />
    <path d="M4 12.5h38V17H4z" fill="#b99bbb" />
    <path d="M4 12.5H1.8v4.5H4M42 12.5h2.2v4.5H42" fill="#9b7e9e" />
    <path d="M23 7.5v5" stroke-width="1.2" />
    <path d="M6 17v3M40 17v3" />
    <rect x="50" y="10.5" width="18" height="6.5" rx="2.5" fill="#b99bbb" />
    <path d="M53 17v3M65 17v3" />
  </symbol>

  <!-- ▸ 2×2: 술 달린 큰 러그. 바닥을 덮는 물건이라 자리를 꽉 채운다 -->
  <symbol id="i-rug" viewBox="0 0 48 48">
    <rect x="3" y="5" width="42" height="38" rx="3" fill="#c98f6a" />
    <rect x="8" y="10.5" width="32" height="27" rx="2" fill="none" stroke-width="1.4" />
    <path d="M13 17h22M13 24h22M13 31h22" stroke-width="1.2" />
    <path d="M3 9.5h42M3 38.5h42" stroke-width="1.2" />
