    <path d="M6.5 5.5h11L12 2z" fill="#a9713f" />
    <path d="M5 12l-1.5 3M19 12l1.5 3" stroke-width="1.4" />
  </symbol>

  <!-- ▸ 2칸: 아래 선반 있는 상판 한 칸 + 공구함 한 칸 -->
  <symbol id="i-bench" viewBox="0 0 48 24">
