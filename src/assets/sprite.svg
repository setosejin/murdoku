    <path d="M25 10V3h12l4.5 7z" fill="#c0392b" />
    <path d="M25 10h32v8H25z" fill="#c0392b" />
    <circle cx="12" cy="18" r="4.2" fill="#3a4750" />
    <circle cx="52" cy="14.5" r="7.5" fill="#3a4750" />
    <circle cx="52" cy="14.5" r="2.8" fill="#b9b1a3" stroke="none" />
    <path d="M60 10.5h8.5v6H60z" fill="#a9713f" />
