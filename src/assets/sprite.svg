    <rect x="9.7" y="6.5" width="3.2" height="5.5" fill="#5a9c62" stroke="none" />
    <rect x="13.4" y="5.5" width="3.2" height="6.5" fill="#e0b13a" stroke="none" />
    <rect x="17.1" y="7" width="3.2" height="5" fill="#8fb8cf" stroke="none" />
    <rect x="6" y="14.5" width="14" height="2.6" fill="#8fb8cf" stroke="none" />
    <rect x="6" y="17.6" width="14" height="2.6" fill="#e0b13a" stroke="none" />
    <rect x="27" y="5.5" width="3.2" height="6.5" fill="#8fb8cf" stroke="none" />
    <rect x="30.7" y="6.5" width="3.2" height="5.5" fill="#c0392b" stroke="none" />
    <rect x="34.4" y="5.5" width="3.2" height="6.5" fill="#5a9c62" stroke="none" />
    <rect x="27" y="15.5" width="15" height="2.6" fill="#e0b13a" stroke="none" />
