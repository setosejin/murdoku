  <!-- ▸ 안뜰의 주인. 방 안에는 안 놓이고 갇힌 빈 칸을 돌아다닌다.
       전부 **오른쪽을 보게** 그린다 — 왼쪽으로 걸을 때는 CSS 가 scale: -1 1 로 뒤집는다.
       `i-<kind>` 는 선 자세, `i-<kind>-sit` 은 앉은 자세다. 둘 다 있어야 한다. -->
