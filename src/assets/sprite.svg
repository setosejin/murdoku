    <path d="M18.2 20.9c2.5 0 3.4-1.5 2.7-2.8" stroke-width="1.5" />
    <circle cx="13.4" cy="9.8" r="4.3" fill="#e8b076" />
    <circle cx="15" cy="9.2" r=".95" fill="currentColor" stroke="none" />
  </symbol>

  <symbol id="i-duck" viewBox="0 0 24 24">
