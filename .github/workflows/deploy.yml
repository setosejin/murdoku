name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 건 끝까지 두고, 대기 중인 것만 갈아치운다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # 워커를 배포한 뒤 Settings → Secrets and variables → Actions → Variables 에
          # VITE_SYNC_URL 을 넣으면 기기 간 기록 동기화가 켜진다.
          # 비어 있으면 기록은 그 기기 안에서만 남는다 (비밀이 아니라 공개 엔드포인트 주소다)
          VITE_SYNC_URL: ${{ vars.VITE_SYNC_URL }}
      # configure-pages 는 안 쓴다. base 가 상대 경로라 base_path 주입이 필요 없고,
      # GITHUB_TOKEN 으로는 Pages 사이트 생성이 막혀 있다.
      # Settings → Pages → Source 를 "GitHub Actions" 로 한 번만 지정할 것.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
